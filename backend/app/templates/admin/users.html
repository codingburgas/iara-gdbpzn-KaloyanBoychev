{% extends "base.html" %}

{% block content %}
<div class="container-fluid px-4 py-4">
    <h1 class="h3 fw-700 mb-4">User Administration</h1>

    <div class="card gdp-card">
        <div class="table-responsive">
            <table class="table table-dark table-hover gdp-table mb-0">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Username</th>
                        <th>Role</th>
                        <th>Active</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    {% for u in users %}
                    <tr>
                        <td>{{ u.full_name }}</td>
                        <td class="font-monospace small">{{ u.username }}</td>
                        <td>
                            <form method="POST" action="{{ url_for('admin.update_role', user_id=u.id) }}"
                                  class="d-flex gap-1">
                                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                                <select name="role" class="form-select form-select-sm" style="width: auto;">
                                    {% for r in roles %}
                                    <option value="{{ r }}" {% if r == u.role.value %}selected{% endif %}>{{ r }}</option>
                                    {% endfor %}
                                </select>
                                <button class="btn btn-sm btn-outline-warning">Save</button>
                            </form>
                        </td>
                        <td>
                            <span class="badge {% if u.is_active %}status-resolved{% else %}status-cancelled{% endif %}">
                                {{ 'ACTIVE' if u.is_active else 'INACTIVE' }}
                            </span>
                        </td>
                        <td>
                            <form method="POST" action="{{ url_for('admin.toggle_active', user_id=u.id) }}">
                                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                                <button class="btn btn-sm btn-outline-secondary">
                                    {{ 'Deactivate' if u.is_active else 'Activate' }}
                                </button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
